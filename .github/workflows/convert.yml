
name: Atom to RSS Converter

on:
  schedule:
    # Run every 6 hours (UTC: 0, 6, 12, 18)
    - cron: "0 */6 * * *"
  workflow_dispatch:

# Prevent multiple workflow runs from pushing simultaneously.
concurrency:
  group: atom-to-rss-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run converter
        run: python convert.py

      - name: Commit and push RSS feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/feed.rss

          # Skip if there are no changes.
          if git diff --cached --quiet; then
            echo "RSS feed has not changed."
            exit 0
          fi

          # Commit the updated RSS feed.
          git commit -m "Update RSS feed $(date -u '+%Y-%m-%d %H:%M UTC')"

          # Rebase onto the latest remote main branch.
          git pull --rebase origin main

          # Push the updated branch.
          git push origin main
